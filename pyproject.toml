[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-desktop-mcp"
dynamic = ["version"]
description = "MCP server that sends and schedules WeChat (微信) messages in the background through the Windows desktop client"
readme = "README.en.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "hhuangpanda" }]
keywords = [
    "mcp", "mcp-server", "model-context-protocol", "wechat", "weixin", "微信",
    "llm", "ai-agent", "claude", "claude-code", "messaging", "scheduling", "automation", "desktop-automation", "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyautogui>=0.9.53",
    "pywin32>=307",
    "psutil>=5.9.0",
    "comtypes>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/hhuangpanda/wechat-desktop-mcp"
Issues = "https://github.com/hhuangpanda/wechat-desktop-mcp/issues"

[project.scripts]
wechat-desktop-mcp = "wechat_desktop_mcp.mcp_server:run"

[tool.setuptools]
packages = ["wechat_desktop_mcp"]
package-dir = { wechat_desktop_mcp = "src" }

# Version comes from the git tag (v1.2.0 -> 1.2.0)
[tool.setuptools_scm]
fallback_version = "0.0.0"
